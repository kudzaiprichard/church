# Local Postgres for development.
#
#   docker compose up -d
#
# Published on host port 5433 rather than 5432, so it does not collide with a
# Postgres installed natively on the same machine. DATABASE_URL in .env must
# match: postgresql://church:church@localhost:5433/church?schema=public
services:
  db:
    image: postgres:17-alpine
    container_name: church-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: church
      POSTGRES_PASSWORD: church
      POSTGRES_DB: church
    ports:
      - "5433:5432"
    volumes:
      - church-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U church -d church"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  church-db-data:
