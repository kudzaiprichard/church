name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # paths-filter reads the PR's changed-file list through the API.
  pull-requests: read

jobs:
  # Path-aware gate. Skipping happens at the JOB level so a skipped job still
  # reports its check to the ruleset — never convert this to workflow-level
  # `paths:` filtering, which would leave required checks stuck on "Expected".
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'src/**'
              - 'prisma/**'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'next.config.ts'
              - 'postcss.config.mjs'
              - 'eslint.config.mjs'
              - 'components.json'
              - 'prisma.config.ts'
              - 'vitest.config.ts'

  web:
    name: Lint & build (web)
    needs: changes
    if: needs.changes.outputs.web == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    env:
      # `next build` imports every module, including the env schema, on a runner
      # that has no database and no business holding production secrets. This
      # substitutes placeholders for the build only — see src/lib/env.ts.
      #
      # It replaces a hand-kept list of fake values here, which had to be
      # updated by hand whenever a variable was added and silently failed the
      # build when someone forgot. It is also what keeps the production rules in
      # the schema honest: `next build` runs with NODE_ENV=production, so a real
      # parse would reject the placeholder http:// APP_URL, which is exactly the
      # check we want firing on a deploy and not on a pull request.
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
